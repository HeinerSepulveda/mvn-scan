[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mvn-scan"
version = "1.8"
description = "Maven vulnerability scanner using OSS Index"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name="Edwin Geinner Castro Sepulveda", email="edwincastrose@gmail.com" }
]
license = "MIT"

dependencies = [
  "beautifulsoup4>=4.14.3",
  "colorama>=0.4.6",
  "Jinja2>=3.1.2",
  "requests>=2.28,<3.0",
  "tqdm>=4.66.2"
]
[project.scripts]
mvn-scan = "mvn_scan.cli:main"

[tool.setuptools.packages.find]
where = ["."]